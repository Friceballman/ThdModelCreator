[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thd-model-workbench"
version = "0.1.0"
description = "Local character production workflow with immutable plans and part revisions"
requires-python = ">=3.11"
dependencies = ["Pillow>=10,<13"]

[project.scripts]
mwb = "model_workbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
